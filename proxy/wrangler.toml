name = "cropcal-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
# Default crops/day per invite code; a code's own `limit` (invite.sh) overrides it.
DAILY_LIMIT = "60"
# Crops/minute per invite code.
BURST_PER_MIN = "10"
# Crops/day across ALL codes (~$2.50/day at Flash list price).
GLOBAL_DAILY_LIMIT = "500"
# Kill switch: set to "1" and redeploy (or set it in the dashboard) to pause the
# service; every request then returns 503.
DISABLED = "0"

# Invite tokens (token:<code> -> {name, limit, disabled}). Created by scripts/setup.sh.
[[kv_namespaces]]
binding = "TOKENS"
id = "fa47b3df2fff4271911c73abba01336f"

# The limits. One QuotaCounter object per invite code plus one service-wide;
# check-and-increment is atomic per object, so these are hard caps.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

# Per-IP noise reduction ahead of the token lookup. Cloudflare's binding is
# approximate and per location (measured: 70 calls -> 2 rejections), so nothing
# relies on it. period must be 10 or 60 seconds.
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 30
  period = 60

# ---- Staging: `wrangler deploy --env staging` -> cropcal-proxy-staging, with its
# own KV namespace, counters and secrets. Bindings and vars are not inherited
# from the top level, so they are repeated here. Created by
# `scripts/setup.sh staging`.
[env.staging.vars]
GEMINI_MODEL = "gemini-3.8-flash"
DAILY_LIMIT = "60"
BURST_PER_MIN = "10"
GLOBAL_DAILY_LIMIT = "200"
DISABLED = "0"

[[env.staging.kv_namespaces]]
binding = "TOKENS"
id = "84395136826144e7b95246f7efd509e2"

[[env.staging.durable_objects.bindings]]
name = "QUOTA"
class_name = "QuotaCounter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["QuotaCounter"]

[[env.staging.ratelimits]]
name = "RL_IP"
namespace_id = "1002"
  [env.staging.ratelimits.simple]
  limit = 30
  period = 60
